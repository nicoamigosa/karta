name: Karta
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  KartaCore:
    path: ../KartaCore
targets:
  Karta:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources
        buildPhase: resources
        excludes:
          - clips
      - path: Resources/clips
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        NSAlarmKitUsageDescription: Karta needs alarms so a Temporizador can ring while the phone is locked.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIAppFonts:
          - Fraunces.ttf
          - Fraunces-Italic.ttf
          - Figtree.ttf
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.karta.Karta
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Karta.entitlements
    # Debug-only clip: EXCLUDED_SOURCE_FILE_NAMES does not reach inside
    # folder references, so strip the debug file after the copy on Release
    # (the rest of clips/ stays).
    postBuildScripts:
      - name: Strip debug clip on Release
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/clips/debug-clip.mp4"
          fi
    dependencies:
      - package: KartaCore
        product: KartaCore
      - package: KartaCore
        product: KartaPresentation
      - target: KartaAlarmWidget
        embed: true
  KartaAlarmWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AlarmWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.karta.Karta.AlarmWidget
        INFOPLIST_FILE: AlarmWidget/Info.plist
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
  KartaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.karta.KartaTests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: Karta
      - package: KartaCore
        product: KartaPresentation
schemes:
  Karta:
    build:
      targets:
        Karta: all
        KartaAlarmWidget: all
    test:
      targets:
        - KartaTests
