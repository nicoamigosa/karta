name: Karta
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  KartaCore:
    path: ../KartaCore
targets:
  Karta:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UIAppFonts:
          - Fraunces.ttf
          - Fraunces-Italic.ttf
          - Figtree.ttf
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: app.karta.Karta
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: KartaCore
        product: KartaCore
      - package: KartaCore
        product: KartaPresentation
  KartaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.karta.KartaTests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: Karta
      - package: KartaCore
        product: KartaPresentation
schemes:
  Karta:
    build:
      targets:
        Karta: all
    test:
      targets:
        - KartaTests
